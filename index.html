        .button-link {
    display: block;
margin: 0 auto;
    background-color: #38bdf8; /* Sleek sky blue background */
    color: #0f172a;            /* Dark text color for contrast */
    padding: 0.75rem 1.5rem;   /* Padding makes it a box shape */
    border-radius: 8px;        /* Rounded modern corners */
    text-decoration: none;     /* Removes the default underline */
    font-weight: bold;
    transition: background-color 0.3s ease; /* Smooth transition animation */
}
.input-field {
    display: block;
    width: 80%;
    max-width: 300px;
    margin: 0 auto 1.5rem auto; /* Centers the box and leaves space below it */
    padding: 0.75rem;
    border: 2px solid #334155;

    font-size: 1rem;
    outline: none;
    transition: border-color 0.3s ease;
}
/* This makes the border glow blue when a user clicks into it */
.input-field:focus {
    border-color: #38bdf8;
}.success-text {
    color: #34d399;
    font-weight: bold;
    margin-top: 1.5rem;
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

       <form id="lead-form">
    <input
        type="email"
        id="register-email"
        placeholder="Enter your email address"
        class="input-field"
        required
    >

    <input
        type="password"
        id="register-password"
        placeholder="Create a password"
        class="input-field"

        type="submit"

        REGISTER

</form>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.getElementById('lead-form').addEventListener('submit', async function(event) {
    event.preventDefault();

    const email = document.getElementById('register-email').value.trim();
    const password = document.getElementById('register-password').value;
    const successMessage = document.getElementById('success-msg');

    try {
        successMessage.style.display = 'none';

        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password
        });

        if (error) {
            throw error;
        }

        console.log("Registered user:", data.user);

        successMessage.textContent =
            "Registration successful. You can now log in.";

        successMessage.style.display = 'block';

        setTimeout(() => {
            window.location.href = '/login.html';
        }, 1500);

    } catch (error) {
        console.error("Registration error:", error);

        alert(error.message);
    }
});
</script>
